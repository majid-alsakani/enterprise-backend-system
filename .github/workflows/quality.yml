name: API quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest httpx ruff
      - run: ruff check --isolated --select E4,E7,E9,F app api tests
      - run: pytest -q tests
